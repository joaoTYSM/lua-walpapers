<!DOCTYPE html><meta charset=utf-8><title>Particle Network</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P={speed:1,color:'#7c8cff'},M={x:.5,y:.5},t=0;
function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();addEventListener('resize',R);
addEventListener('mousemove',function(e){M.x=e.clientX/W;M.y=e.clientY/H});
function wallpaperProperty(n,v){P[n]=v}
var N=[];function init(){N=[];for(var i=0;i<Math.min(140,W*H/14000|0);i++)N.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5),vy:(Math.random()-.5)})}init();addEventListener('resize',init);
(function f(){x.fillStyle='#07070f';x.fillRect(0,0,W,H);var mx=M.x*W,my=M.y*H;
for(var a of N){a.x+=a.vx*P.speed;a.y+=a.vy*P.speed;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;
x.fillStyle=P.color;x.beginPath();x.arc(a.x,a.y,2,0,7);x.fill();
for(var b of N){var d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.globalAlpha=(1-d/130)*.5;x.strokeStyle=P.color;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
var dm=Math.hypot(a.x-mx,a.y-my);if(dm<200){x.globalAlpha=(1-dm/200);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(mx,my);x.stroke()}x.globalAlpha=1}
requestAnimationFrame(f)})();
</script>
