<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lua Fluid</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05050f}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const config = {
  SIM_RESOLUTION: 96,
  DYE_RESOLUTION: 768,
  DENSITY_DISSIPATION: 1.1,
  VELOCITY_DISSIPATION: 0.4,
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 16,
  CURL: 28,
  SPLAT_RADIUS: 0.3,
  COLOR_SPEED: 1,
  FREQ_RANGE: 12,
  FREQ_MULTI: 1,
  SOUND_SENSITIVITY: 1,
  MOUSE_TRAIL: true,
  HOVER_FLOW: false,
  TRAIL_SIZE: 0.35,
  TRAIL_POWER: 1
};
const QUALITY = [[64, 512], [96, 768], [128, 1024]];
let curQuality = 1;

let _isSleep = false;
let _audioReact = true;
let _runRandom = true;
let lastBass = 0;
let hue = Math.random();
let randomTimer = 0;
let lastAudioAt = 0;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });
gl.getExtension('EXT_color_buffer_float');

const VS = `#version 300 es
precision highp float;
in vec2 aPosition;
out vec2 vUv,vL,vR,vT,vB;
uniform vec2 texelSize;
void main(){
  vUv=aPosition*.5+.5;
  vL=vUv-vec2(texelSize.x,0.);
  vR=vUv+vec2(texelSize.x,0.);
  vT=vUv+vec2(0.,texelSize.y);
  vB=vUv-vec2(0.,texelSize.y);
  gl_Position=vec4(aPosition,0.,1.);
}`;

const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv,vL,vR,vT,vB;
out vec4 o;
`;

const FS = {
  splat: `uniform sampler2D uTarget;uniform float aspect,radius;uniform vec3 color;uniform vec2 point;
void main(){vec2 p=vUv-point;p.x*=aspect;o=vec4(texture(uTarget,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
  advection: `uniform sampler2D uVelocity,uSource;uniform vec2 texelSize;uniform float dt,dissipation;
void main(){vec2 c=vUv-dt*texture(uVelocity,vUv).xy*texelSize;o=texture(uSource,c)/(1.+dissipation*dt);}`,
  divergence: `uniform sampler2D uVelocity;
void main(){float L=texture(uVelocity,vL).x,R=texture(uVelocity,vR).x,T=texture(uVelocity,vT).y,B=texture(uVelocity,vB).y;
vec2 C=texture(uVelocity,vUv).xy;
if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;
o=vec4(.5*(R-L+T-B),0.,0.,1.);}`,
  curl: `uniform sampler2D uVelocity;
void main(){float L=texture(uVelocity,vL).y,R=texture(uVelocity,vR).y,T=texture(uVelocity,vT).x,B=texture(uVelocity,vB).x;
o=vec4(.5*(R-L-T+B),0.,0.,1.);}`,
  vorticity: `uniform sampler2D uVelocity,uCurl;uniform float curl,dt;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+.0001;f*=curl*C;f.y*=-1.;
vec2 v=clamp(texture(uVelocity,vUv).xy+f*dt,-1000.,1000.);o=vec4(v,0.,1.);}`,
  pressure: `uniform sampler2D uPressure,uDivergence;
void main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;
o=vec4((L+R+B+T-texture(uDivergence,vUv).x)*.25,0.,0.,1.);}`,
  gradient: `uniform sampler2D uPressure,uVelocity;
void main(){float L=texture(uPressure,vL).x,R=texture(uPressure,vR).x,T=texture(uPressure,vT).x,B=texture(uPressure,vB).x;
o=vec4(texture(uVelocity,vUv).xy-vec2(R-L,T-B),0.,1.);}`,
  clear: `uniform sampler2D uTexture;uniform float value;
void main(){o=value*texture(uTexture,vUv);}`,
  display: `uniform sampler2D uTexture;
void main(){vec3 c=texture(uTexture,vUv).rgb;c=1.-exp(-c*2.3);c=mix(c,vec3(1.),.3*smoothstep(.15,1.,max(c.r,max(c.g,c.b))));
vec3 bg=mix(vec3(.015,.02,.06),vec3(.06,.02,.1),vUv.y);
float v=1.-.35*length(vUv-.5);
o=vec4((bg+c)*v,1.);}`
};

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

function makeProgram(src) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HEAD + src));
  gl.bindAttribLocation(p, 0, 'aPosition');
  gl.linkProgram(p);
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

const P = {};
for (const k in FS) P[k] = makeProgram(FS[k]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 3, 3, -1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function fbo(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { t, f, w, h, tx: 1 / w, ty: 1 / h };
}

function dbl(w, h) {
  let a = fbo(w, h), b = fbo(w, h);
  return {
    get read() { return a; },
    get write() { return b; },
    swap() { const x = a; a = b; b = x; },
    free() { [a, b].forEach(o => { gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); }); }
  };
}

function resolution(base) {
  let a = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (a < 1) a = 1 / a;
  const min = Math.round(base), max = Math.round(base * a);
  return gl.drawingBufferWidth > gl.drawingBufferHeight ? [max, min] : [min, max];
}

let velocity, dye, pressure, divergence, curlFbo;

function release() {
  [velocity, dye, pressure].forEach(o => { if (o) o.free(); });
  [divergence, curlFbo].forEach(o => { if (o) { gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); } });
}

function init() {
  release();
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  const [sw, sh] = resolution(config.SIM_RESOLUTION);
  const [dw, dh] = resolution(config.DYE_RESOLUTION);
  velocity = dbl(sw, sh);
  dye = dbl(dw, dh);
  pressure = dbl(sw, sh);
  divergence = fbo(sw, sh);
  curlFbo = fbo(sw, sh);
}

function tex(unit, t) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  return unit;
}

function draw(target) {
  if (target) {
    gl.viewport(0, 0, target.w, target.h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.f);
  } else {
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function hsv(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}

function nextColor(k) {
  hue = (hue + config.COLOR_SPEED * 0.03 + Math.random() * 0.12) % 1;
  const c = hsv(hue, 0.38, 1);
  return [c[0] * k * 0.3, c[1] * k * 0.3, c[2] * k * 0.3];
}

function splat(x, y, dx, dy, c, rad) {
  const p = P.splat;
  const aspect = canvas.width / canvas.height;
  let r = (rad || config.SPLAT_RADIUS) / 100;
  if (aspect > 1) r *= aspect;
  gl.useProgram(p.p);
  gl.uniform1f(p.u.aspect, aspect);
  gl.uniform2f(p.u.point, x, y);
  gl.uniform1f(p.u.radius, r);
  gl.uniform1i(p.u.uTarget, tex(0, velocity.read.t));
  gl.uniform3f(p.u.color, dx, dy, 0);
  draw(velocity.write);
  velocity.swap();
  gl.uniform1i(p.u.uTarget, tex(0, dye.read.t));
  gl.uniform3f(p.u.color, c[0], c[1], c[2]);
  draw(dye.write);
  dye.swap();
}

function multipleSplats(amount) {
  const n = Math.min(Math.max(Math.floor(amount), 0), 6);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const force = 2500 + Math.random() * 4000;
    splat(
      Math.random(),
      Math.random(),
      Math.cos(a) * force,
      Math.sin(a) * force,
      nextColor(1.4)
    );
  }
}

function onAudio(audioArray) {
  if (audioArray[0] === 0 || _isSleep == true) {
    _runRandom = true;
    return;
  }

  _runRandom = false;

  if (!_audioReact) {
    return;
  }

  let bass = 0.0;

  for (let i = 0; i <= config.FREQ_RANGE; i++)
    bass += audioArray[i] * 2;

  bass /= config.FREQ_RANGE * 2 * config.FREQ_MULTI;

  const level = bass * config.SOUND_SENSITIVITY * 10;
  const hit = level - lastBass;
  lastBass = lastBass * 0.85 + level * 0.15;
  if (hit > 0.6) multipleSplats(Math.ceil(hit));
}

function hostAudio(arr) {
  lastAudioAt = performance.now();
  onAudio(arr);
}

setInterval(() => {
  if (lastAudioAt && performance.now() - lastAudioAt > 600) _runRandom = true;
}, 300);

function wallpaperProperty(name, val) {
  if (name === 'audioReact') _audioReact = val;
  if (name === 'sensitivity') config.SOUND_SENSITIVITY = val;
  if (name === 'curl') config.CURL = val;
  if (name === 'dissipation') config.DENSITY_DISSIPATION = val;
  if (name === 'splatRadius') config.SPLAT_RADIUS = val;
  if (name === 'colorSpeed') config.COLOR_SPEED = val;
  if (name === 'mouseTrail') config.MOUSE_TRAIL = !!val;
  if (name === 'hoverFlow') config.HOVER_FLOW = !!val;
  if (name === 'trailSize') config.TRAIL_SIZE = val;
  if (name === 'trailPower') config.TRAIL_POWER = val;
  if (name === 'quality' && val !== curQuality && QUALITY[val]) {
    curQuality = val;
    config.SIM_RESOLUTION = QUALITY[val][0];
    config.DYE_RESOLUTION = QUALITY[val][1];
    init();
  }
}

let dragging = false, tx = 0, ty = 0, trailHue = Math.random();

function trailColor(k) {
  trailHue = (trailHue + 0.006 * config.COLOR_SPEED) % 1;
  const c = hsv(trailHue, 0.55, 1);
  return [c[0] * k, c[1] * k, c[2] * k];
}

function trailTo(x, y) {
  const aspect = canvas.width / canvas.height;
  const dx = x - tx, dy = y - ty;
  const dist = Math.hypot(dx * aspect, dy);
  const steps = Math.min(24, Math.max(1, Math.ceil(dist / 0.012)));
  const k = 0.75 / Math.sqrt(steps);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    splat(tx + dx * t, ty + dy * t, dx * 4500 * config.TRAIL_POWER, dy * 4500 * config.TRAIL_POWER, trailColor(k), config.TRAIL_SIZE);
  }
}

function hostMouse(nx, ny, ev, buttons) {
  const x = nx, y = 1 - ny, left = (buttons & 1) === 1;
  if (ev === 'down' && left) {
    dragging = true;
    tx = x;
    ty = y;
    if (config.MOUSE_TRAIL) splat(x, y, 0, 0, trailColor(1.1), config.TRAIL_SIZE);
  } else if (ev === 'up' && !left) {
    dragging = false;
  } else if (ev === 'move') {
    if (dragging && left) {
      if (config.MOUSE_TRAIL) trailTo(x, y);
    } else if (config.HOVER_FLOW && !_isSleep) {
      splat(x, y, (x - tx) * 5000, (y - ty) * 5000, trailColor(0.5));
    }
    tx = x;
    ty = y;
  }
}

function wallpaperPlaybackChanged(data) {
  _isSleep = JSON.parse(data).IsPaused;
}

function step(dt) {
  gl.disable(gl.BLEND);
  let p = P.curl;
  gl.useProgram(p.p);
  gl.uniform2f(p.u.texelSize, velocity.read.tx, velocity.read.ty);
  gl.uniform1i(p.u.uVelocity, tex(0, velocity.read.t));
  draw(curlFbo);

  p = P.vorticity;
  gl.useProgram(p.p);
  gl.uniform2f(p.u.texelSize, velocity.read.tx, velocity.read.ty);
  gl.uniform1i(p.u.uVelocity, tex(0, velocity.read.t));
  gl.uniform1i(p.u.uCurl, tex(1, curlFbo.t));
  gl.uniform1f(p.u.curl, config.CURL);
  gl.uniform1f(p.u.dt, dt);
  draw(velocity.write);
  velocity.swap();

  p = P.divergence;
  gl.useProgram(p.p);
  gl.uniform2f(p.u.texelSize, velocity.read.tx, velocity.read.ty);
  gl.uniform1i(p.u.uVelocity, tex(0, velocity.read.t));
  draw(divergence);

  p = P.clear;
  gl.useProgram(p.p);
  gl.uniform1i(p.u.uTexture, tex(0, pressure.read.t));
  gl.uniform1f(p.u.value, config.PRESSURE);
  draw(pressure.write);
  pressure.swap();

  p = P.pressure;
  gl.useProgram(p.p);
  gl.uniform2f(p.u.texelSize, velocity.read.tx, velocity.read.ty);
  gl.uniform1i(p.u.uDivergence, tex(0, divergence.t));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(p.u.uPressure, tex(1, pressure.read.t));
    draw(pressure.write);
    pressure.swap();
  }

  p = P.gradient;
  gl.useProgram(p.p);
  gl.uniform2f(p.u.texelSize, velocity.read.tx, velocity.read.ty);
  gl.uniform1i(p.u.uPressure, tex(0, pressure.read.t));
  gl.uniform1i(p.u.uVelocity, tex(1, velocity.read.t));
  draw(velocity.write);
  velocity.swap();

  p = P.advection;
  gl.useProgram(p.p);
  gl.uniform2f(p.u.texelSize, velocity.read.tx, velocity.read.ty);
  gl.uniform1i(p.u.uVelocity, tex(0, velocity.read.t));
  gl.uniform1i(p.u.uSource, tex(0, velocity.read.t));
  gl.uniform1f(p.u.dt, dt);
  gl.uniform1f(p.u.dissipation, config.VELOCITY_DISSIPATION);
  draw(velocity.write);
  velocity.swap();

  gl.uniform1i(p.u.uVelocity, tex(0, velocity.read.t));
  gl.uniform1i(p.u.uSource, tex(1, dye.read.t));
  gl.uniform1f(p.u.dissipation, config.DENSITY_DISSIPATION);
  draw(dye.write);
  dye.swap();

  p = P.display;
  gl.useProgram(p.p);
  gl.uniform1i(p.u.uTexture, tex(0, dye.read.t));
  draw(null);
}

let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.016666);
  last = now;
  if (_isSleep) return;

  if (_runRandom || !_audioReact) {
    randomTimer -= dt;
    if (randomTimer <= 0) {
      randomTimer = 0.9 + Math.random() * 0.9;
      const n = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        splat(Math.random(), Math.random(), Math.cos(a) * 3000, Math.sin(a) * 3000, nextColor(1));
      }
    }
  }

  step(dt);
}

let px = null, py = 0;
addEventListener('pointermove', e => {
  const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
  if (config.HOVER_FLOW && px !== null) splat(x, y, (x - px) * 5000, (y - py) * 5000, nextColor(0.6));
  px = x;
  py = y;
});

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(init, 200);
});

init();
for (let i = 0; i < 5; i++) {
  const a = Math.random() * Math.PI * 2;
  splat(Math.random(), Math.random(), Math.cos(a) * 3000, Math.sin(a) * 3000, nextColor(1.2));
}
requestAnimationFrame(frame);
</script>
</body>
</html>
