<!DOCTYPE html><meta charset=utf-8><title>Starfield</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P={speed:1,color:'#9fb4ff'},M={x:.5,y:.5},t=0;
function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();addEventListener('resize',R);
addEventListener('mousemove',function(e){M.x=e.clientX/W;M.y=e.clientY/H});
function wallpaperProperty(n,v){P[n]=v}
var S=[];for(var i=0;i<500;i++)S.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()});
(function f(){t++;x.fillStyle='rgba(0,0,8,.35)';x.fillRect(0,0,W,H);x.fillStyle=P.color;
for(var s of S){s.z-=.004*P.speed;if(s.z<=.01){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1}
var k=.5/s.z,px=W/2+(s.x+(M.x-.5)*.4)*k*W/2,py=H/2+(s.y+(M.y-.5)*.4)*k*H/2,r=Math.max(.3,(1-s.z)*2.6);x.globalAlpha=1-s.z;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
x.globalAlpha=1;requestAnimationFrame(f)})();
</script>
