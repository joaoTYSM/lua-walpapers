<!DOCTYPE html><meta charset=utf-8><title>Aurora Waves</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P={speed:1,color:'#4ac8ff'},M={x:.5,y:.5},t=0;
function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();addEventListener('resize',R);
addEventListener('mousemove',function(e){M.x=e.clientX/W;M.y=e.clientY/H});
function wallpaperProperty(n,v){P[n]=v}
(function f(){t+=.008*P.speed;var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04030f');g.addColorStop(1,'#0b1030');x.fillStyle=g;x.fillRect(0,0,W,H);
x.globalCompositeOperation='lighter';
for(var k=0;k<5;k++){x.beginPath();x.moveTo(0,H);for(var i=0;i<=W;i+=12){x.lineTo(i,H*.55+Math.sin(i*.003+t*(1+k*.3)+k)*H*.12+Math.sin(i*.007-t*1.3+(M.x*4))*H*.05-k*H*.04)}x.lineTo(W,H);x.closePath();
x.fillStyle='hsla('+((k*45+t*30+(P.color=='#4ac8ff'?180:260))%360)+',85%,55%,.16)';x.fill()}
x.globalCompositeOperation='source-over';requestAnimationFrame(f)})();
</script>
